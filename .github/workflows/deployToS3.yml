name: DeployToAWSS3
 
on:
  push:
    branches:
      - dev
      - main

 
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '10.0.*'

    - name: Inject production appsettings
      env:
        ONBOARDING_API_BASE_URL: ${{ secrets.ONBOARDING_API_BASE_URL }}
      run: |
        if [ -z "$ONBOARDING_API_BASE_URL" ]; then
          echo "::error::ONBOARDING_API_BASE_URL repository secret is required for deploy builds."
          exit 1
        fi
        printf '%s\n' \
          '{' \
          '  "OnboardingApi": {' \
          "    \"BaseUrl\": \"${ONBOARDING_API_BASE_URL%/}\"" \
          '  }' \
          '}' > wwwroot/appsettings.json

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: dotnet publish
      run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/blazorapp

    - name: Generate SPA route fallbacks
      run: bash scripts/generate-spa-fallbacks.sh ${{env.DOTNET_ROOT}}/blazorapp/wwwroot

    - name: Publish artifacts
      uses: actions/upload-artifact@master
      with:
        name: blazorStaticSite
        path: ${{env.DOTNET_ROOT}}/blazorapp
 
  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    steps:
 
    # Download artifacts
    - name: Download artifacts
      uses: actions/download-artifact@main
      with:
        name: blazorStaticSite

    - name: Deploy to S3 🚀
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_S3_BUCKET: 'www.mattopie.com'
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-1'    # optional: defaults to us-east-1
        SOURCE_DIR: 'wwwroot'      # optional: defaults to entire repository

    # After sync so --delete cannot wipe bare route keys, and HTML/boot always win with no-cache.
    - name: Set no-cache on HTML shells and boot manifest
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        CACHE="no-cache, no-store, must-revalidate"
        INDEX="wwwroot/index.html"
        ROUTES="portfolio onboarding resume cv markdown typing pomodoro weather counter cv/licenses"

        aws s3 cp "$INDEX" "s3://www.mattopie.com/index.html" \
          --acl public-read --content-type text/html --cache-control "$CACHE"
        aws s3 cp "wwwroot/404.html" "s3://www.mattopie.com/404.html" \
          --acl public-read --content-type text/html --cache-control "$CACHE"

        for route in $ROUTES; do
          aws s3 cp "$INDEX" "s3://www.mattopie.com/$route" \
            --acl public-read --content-type text/html --cache-control "$CACHE"
          aws s3 cp "wwwroot/$route/index.html" "s3://www.mattopie.com/$route/index.html" \
            --acl public-read --content-type text/html --cache-control "$CACHE"
        done

        aws s3 cp "wwwroot/_framework/blazor.boot.json" "s3://www.mattopie.com/_framework/blazor.boot.json" \
          --acl public-read --content-type application/json --cache-control "$CACHE"
